{% extends "base.html" %}
{% block title %}Вход — Личный кабинет{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" action="/login" class="form">
    <label>Email
        <input type="email" name="email" value="{{ form.email if form else '' }}" required>
    </label>
    <label>Пароль
        <input type="password" name="password" required>
    </label>
    <button type="submit">Войти</button>
</form>
<p>Ещё нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
{% endblock %}

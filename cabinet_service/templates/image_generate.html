{% extends "base.html" %}
{% block title %}Сгенерировать картинку — Личный кабинет{% endblock %}
{% block content %}
<h1>Генерация картинки</h1>
<form method="post" action="/images/generate" class="form">
    <label>Что нарисовать?
        <textarea name="prompt" rows="4" required placeholder="Например: современный кофейный стакан на белом фоне, логотип для кофейни">{{ form.prompt if form else '' }}</textarea>
    </label>
    <label>Размер
        <select name="size" required>
            {% for key, (value, label) in sizes.items() %}
            <option value="{{ key }}" {% if form and form.size == key %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Стиль
        <select name="style">
            {% for key, (label, suffix) in styles.items() %}
            <option value="{{ key }}" {% if form and form.style == key %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <button type="submit">🎨 Сгенерировать</button>
    <p class="form-hint">Генерация занимает 10–60 секунд. Картинка сохранится в медиа-библиотеку.</p>
</form>
<p><a href="/images">← Назад в библиотеку</a></p>
{% endblock %}
